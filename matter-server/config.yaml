name: Matter Server
version: 0.1.0
slug: matter_server
description: Matter WebSocket Server for Home Assistant
url: https://github.com/AndreySimokhin/home-assistant-addons/tree/main/matter-server
arch:
  - aarch64
  - amd64
startup: services
boot: auto
stage: stable
init: false
discovery:
  - matter
hassio_api: false
homeassistant: 2024.6.0
host_network: true
host_dbus: true
host_ipc: false
ingress: true
ingress_port: 5580
apparmor: true
ports:
  5580/tcp: null
ports_description:
  5580/tcp: Matter Server WebSocket API
map:
  - type: addon_config
    read_only: false
options:
  log_level: info
  port: 5580
  listen_address: ""
  primary_interface: ""
  bluetooth_adapter: -1
  vendor_id: 65521
  fabric_id: 1
  storage_path: /config/matterjs-server
  disable_ota: true
  disable_dashboard: false
  production_mode: true
  prefer_ipv4: true
  enable_test_net_dcl: false
  run_as_root: false
  extra_args: []
  env_vars: []
schema:
  log_level: list(verbose|debug|info|warning|error|critical)
  port: port
  listen_address: str?
  primary_interface: str?
  bluetooth_adapter: int
  vendor_id: int
  fabric_id: int
  storage_path: str
  disable_ota: bool
  disable_dashboard: bool
  production_mode: bool
  prefer_ipv4: bool
  enable_test_net_dcl: bool?
  run_as_root: bool
  extra_args:
    - str?
  env_vars:
    - match(^[A-Za-z_][A-Za-z0-9_]*=.*$)?
